[build]
target = "thumbv8m.main-none-eabihf"

[target."thumbv8m.main-none-eabihf"]
rustflags = [
    "-C", "target-cpu=cortex-m33",
    "-C", "link-arg=-Tm33.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=-e", "-C", "link-arg=bench_init",
    "-C", "link-arg=-u", "-C", "link-arg=bench_frames",
]
